    <!-- 01 O-RAN -->
    <button class="sheet" type="button" data-id="oran" data-area="networks">
      <span class="drawing" aria-hidden="true">
        <svg viewBox="0 0 240 140" fill="none" stroke="#1F6FC5" stroke-width="1.5" stroke-linecap="round">
          <path d="M40 110 L55 60 L70 110 M45 92 H65"/><path d="M120 110 L135 60 L150 110 M125 92 H145"/><path d="M200 110 L215 60 L230 110 M205 92 H225" stroke="#6AAEE8" stroke-dasharray="3 3"/>

          <text x="196" y="128" font-family="IBM Plex Mono, monospace" font-size="9" fill="#4A6585" stroke="none">poisoned</text>
        </svg>
      </span>
      <span class="sheet-body"><strong>Trust-aware federated O-RAN</strong><span>Per-user and per-cell trust so attacked cells can't poison the shared PPO allocator.</span></span>
      <span class="title-block"><span>NETWORKS</span><span>2026 →</span><span>SHT 01</span></span>
      <template>
        <p>Research on federated deep RL for O-RAN resource allocation that stays robust under adversarial updates.</p>
        <ul>
          <li>Designing a two-tier trust framework for federated DRL xApps: per-user trust scores clean manipulated reports and down-weight suspicious training data, while per-cell trust weights limit how far attacked cells can poison the shared model.</li>
          <li>Building a slice-aware PPO allocator for PRBs and power that handles a varying number of users, with an observer rApp that separates genuine traffic shifts from attacks.</li>
          <li>Benchmarking against RADAR, SA-PPO, FLTrust and FedAvg.</li>
        </ul>
        <div data-stack>Python · PyTorch · PPO · ns-3 (5G-LENA) · ns3-ai</div>
        <div data-meta>NETWORKS × RL|Aug 2026 →|Research|SHT 01</div>
      </template>
    </button>

      <span class="sheet-body"><strong>OS simulation suite</strong><span>A CPU scheduler, a virtual memory manager and a multi-process search engine, built from syscalls up.</span></span>

        <p>Three simulators for how an operating system shares the CPU, memory and processes.</p>
        <ul>
          <li>A multi-process pattern-matching engine with hierarchical file chunking, processes created via fork/exec, and coordinated cleanup with POSIX signals.</li>
          <li>A CPU scheduling simulator for FIFO, non-preemptive SJF, preemptive SJF and Round Robin, on single and multi-processor systems with CPU and I/O bursts.</li>
          <li>A virtual memory manager with configurable page sizes and frame allocations, global and local policies, and Optimal, FIFO, LRU and Random replacement.</li>
        </ul>
        <div data-stack>C++ · POSIX system calls · process management · CPU scheduling · virtual memory · Make</div>
        <div data-meta>SYSTEMS|Aug – Nov 2025|IIT Dharwad|SHT 08</div>
